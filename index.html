<style>
/* Layout: ledger workbench — sticky dark header with tabs, one working column of panels, status bar at the foot; tables scroll inside their own frame */
:root{
  --bg:#eef2f4; --panel:#ffffff; --panel2:#f6f8f9; --ink:#14202b; --muted:#5b6977; --line:#d9e0e6;
  --accent:#9a6a1c; --accent-soft:#f4ead8; --accent-ink:#ffffff;
  --head:#13212d; --head-ink:#eef3f6; --head-muted:#9fb0bf;
  --pos:#1d7348; --pos-soft:#e2f2e9; --neg:#b0352c; --neg-soft:#f8e5e3; --warn:#9a5b00; --warn-soft:#fbefd9; --info:#245d8f; --info-soft:#e3eef8;
  --font:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141a; --panel:#151f28; --panel2:#1a2631; --ink:#e6edf2; --muted:#93a3b1; --line:#283744;
  --accent:#d9a650; --accent-soft:#33291a; --accent-ink:#161005;
  --head:#0a1016; --head-ink:#e6edf2; --head-muted:#8b9cab;
  --pos:#5cc994; --pos-soft:#15301f; --neg:#f08378; --neg-soft:#3a1b18; --warn:#e8b25a; --warn-soft:#382a12; --info:#7fb6e6; --info-soft:#16283a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141a; --panel:#151f28; --panel2:#1a2631; --ink:#e6edf2; --muted:#93a3b1; --line:#283744;
  --accent:#d9a650; --accent-soft:#33291a; --accent-ink:#161005;
  --head:#0a1016; --head-ink:#e6edf2; --head-muted:#8b9cab;
  --pos:#5cc994; --pos-soft:#15301f; --neg:#f08378; --neg-soft:#3a1b18; --warn:#e8b25a; --warn-soft:#382a12; --info:#7fb6e6; --info-soft:#16283a;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:14.5px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
*{box-sizing:border-box}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
td.num,th.num{display:table-cell;direction:inherit;unicode-bidi:normal}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);color:var(--head-ink)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.brand h1{margin:0;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--head-muted);font-size:12px;font-weight:500}
.status{font-size:12px;color:var(--head-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--head-muted)}
.dot.on{background:#4fc48a}.dot.off{background:#e0786e}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:4px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--head-muted);padding:9px 13px 11px;cursor:pointer;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:var(--head-ink)}
.tab[aria-current="page"]{color:var(--head-ink);border-bottom-color:var(--accent)}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--neg);color:#fff;font-size:11px;margin-inline-start:4px;line-height:18px;text-align:center}

main{padding-block:18px 40px;display:block}
.page{display:grid;gap:16px}
.notice{margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel h2 .sub{font-weight:500;color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
@media (max-width:560px){.brand small{display:none}.kpi .val{font-size:18px}.statusbar .opt{display:none}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .val{font-size:21px;font-weight:800;margin-top:4px}
.kpi .hint{color:var(--muted);font-size:12px}
.lnk{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--muted)}.warnc{color:var(--warn)}

.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.alert{border-radius:var(--r);padding:10px 12px;border:1px solid var(--line);background:var(--panel);display:grid;gap:0;cursor:pointer;text-align:start}
.alert .n{font-size:20px;font-weight:800}
.alert .t{font-size:12.5px;font-weight:600}
.alert.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.alert.neg{background:var(--neg-soft);border-color:transparent;color:var(--neg)}
.alert.ok{background:var(--pos-soft);border-color:transparent;color:var(--pos)}

.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;color:var(--muted);font-weight:600;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
td.r,th.r{text-align:end}
td.nw{white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
tr.void td{opacity:.45;text-decoration:line-through}
tr.pend td:first-child{box-shadow:inset -3px 0 0 var(--warn)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.pos{background:var(--pos-soft);border-color:transparent}.chip.neg{background:var(--neg-soft);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.seg.big button{padding:9px 18px;font-size:14px}
.seg.big button.buy[aria-pressed="true"]{background:var(--pos);border-color:var(--pos);color:#fff}
.seg.big button.sell[aria-pressed="true"]{background:var(--neg);border-color:var(--neg);color:#fff}

.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px 18px}
.qgroup h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:700}
.qbtns{display:flex;flex-wrap:wrap;gap:6px}
.qbarw{background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.qbar{display:flex;gap:2px;align-items:center;padding:4px 0;white-space:nowrap;overflow:hidden;flex-wrap:wrap}
.qbar .qbrow{display:flex;gap:2px;align-items:center;width:100%;overflow:hidden}
.qbar .qbrow.menus{border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:2px;overflow-x:auto;scrollbar-width:none}
.qbar .qb .ic,.qbmenu .qb .ic{display:inline-block;width:1.4em;text-align:center;margin-inline-end:4px}
.qbar .qb kbd{font:10px/1 inherit;color:var(--muted);margin-inline-start:4px;border:1px solid var(--line);border-radius:3px;padding:1px 3px}
.qbar .qbm{font-weight:700}
#qdet>summary::-webkit-details-marker{display:none}
@media (max-width:700px),(hover:none){.qbar .qb kbd{display:none}}
.qbar .qb{border:0;background:transparent;padding:6px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:600;flex:0 0 auto;font-family:inherit}
.qbar .qb:hover,.qbmenu .qb:hover{background:var(--panel2)}
.qbar .qbx{margin-inline-start:auto;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:4px 9px;cursor:pointer;font-weight:700;flex:0 0 auto;color:var(--ink)}
.qbmenu{position:absolute;inset-inline-end:16px;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;min-width:230px;max-height:70vh;overflow:auto;display:flex;flex-direction:column}
.qbmenu .qb{border:0;background:transparent;text-align:start;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink);font-family:inherit}
.qbtn{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.qbtn:hover{border-color:var(--accent)}
.qbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px 14px}
.field{display:grid;gap:4px;min-width:0;align-content:start}
.field.wide{grid-column:1/-1}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.field .help{font-size:11.5px;color:var(--muted)}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input.ltr{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
input[readonly]{background:var(--panel);color:var(--muted)}
textarea{min-height:64px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer}
.box{grid-column:1/-1;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel2)}
.box>.ttl{font-weight:700;font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.box .form input,.box .form select{background:var(--panel)}
.ratebox{display:grid;grid-template-columns:76px 1fr;gap:6px}
.accpick{display:grid;gap:4px}
.accq{padding:6px 10px !important;font-size:12.5px}
.balline{font-size:12px;display:flex;flex-wrap:wrap;gap:4px}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:600}
.btn.danger{color:var(--neg)}
.btn.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.calc{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;font-size:13.5px}
.calc b{font-size:15px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.msg{font-size:13px;font-weight:600}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;align-items:end;margin-bottom:14px}

.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.cust{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel);cursor:pointer;display:grid;gap:6px;text-align:start}
.cust:hover{border-color:var(--accent)}
.cust .nm{font-weight:700}
.cust .ph{color:var(--muted);font-size:12.5px}

.modal{position:fixed;inset:0;z-index:20;background:rgba(5,10,15,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border-radius:14px;width:min(860px,100%);max-height:100%;overflow:auto;padding:18px;border:1px solid var(--line)}
.sheet h3{margin:0;font-size:16px}
.receipt{border:1px dashed var(--line);border-radius:var(--r);padding:16px;display:grid;gap:7px;background:var(--panel2)}
.receipt .rh{text-align:center;border-bottom:1px dashed var(--line);padding-bottom:10px}
.receipt .rh b{font-size:17px;display:block}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.kv span:first-child{color:var(--muted);flex:none}
.kv span:last-child{text-align:end}
.toast{position:fixed;bottom:calc(46px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:999px;z-index:30;font-weight:600;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease}@keyframes up{from{transform:translateY(10px);opacity:0}}}
.la-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}.la-b{flex:1 1 140px;padding:12px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}.la-b:disabled{opacity:.55;cursor:default}.la-b.pos span:first-child{color:var(--pos)}.la-b.neg span:first-child{color:var(--neg)}.la-b.warn span:first-child{color:var(--warn,#b7791f)}#sheet h4{margin:12px 0 6px;font-size:13px}
.pd-list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px}.pd-g{font-weight:700;font-size:12px;color:var(--muted);margin:10px 0 4px}.pd-i{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px}.pd-i.off{color:var(--muted);text-decoration:line-through}
:root[data-skin="blue"]{--accent:#1f5fa8;--accent-soft:#e1ecf8;--head:#0f2a47;--head-muted:#a9bed6}
:root[data-skin="gray"]{--accent:#4b5966;--accent-soft:#e7ebef;--head:#2a3239;--head-muted:#b2bcc5}
:root[data-skin="green"]{--accent:#2d7a4b;--accent-soft:#e0f1e7;--head:#173326;--head-muted:#a7c3b4}
:root[data-skin="classic"]{--accent:#7a3b2e;--accent-soft:#f3e3df;--head:#3a2420;--head-muted:#cdb3ad;--bg:#f3efe9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-skin="blue"]{--accent:#6fa8e8;--accent-soft:#16283a;--accent-ink:#06121f}:root:not([data-theme="light"])[data-skin="gray"]{--accent:#a8b6c3;--accent-soft:#242c33;--accent-ink:#0d1114}:root:not([data-theme="light"])[data-skin="green"]{--accent:#6cc795;--accent-soft:#15301f;--accent-ink:#06150c}:root:not([data-theme="light"])[data-skin="classic"]{--accent:#e08f7b;--accent-soft:#3a1f1a;--accent-ink:#1d0a06;--bg:#0d141a}}
:root[data-theme="dark"][data-skin="blue"]{--accent:#6fa8e8;--accent-soft:#16283a;--accent-ink:#06121f}:root[data-theme="dark"][data-skin="gray"]{--accent:#a8b6c3;--accent-soft:#242c33;--accent-ink:#0d1114}:root[data-theme="dark"][data-skin="green"]{--accent:#6cc795;--accent-soft:#15301f;--accent-ink:#06150c}:root[data-theme="dark"][data-skin="classic"]{--accent:#e08f7b;--accent-soft:#3a1f1a;--accent-ink:#1d0a06;--bg:#0d141a}
:root[data-fs="lg"] body{font-size:16px}:root[data-fs="sm"] body{font-size:13.5px}
.sb-btn{background:none;border:1px solid var(--head-muted);color:var(--head-ink);border-radius:999px;padding:1px 10px;font:inherit;font-size:12px;cursor:pointer}
.skin-opt{display:flex;gap:8px;flex-wrap:wrap}.skin-opt button{border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel);cursor:pointer;font:inherit;display:flex;gap:8px;align-items:center;color:var(--ink)}.skin-opt button[aria-pressed="true"]{border-color:var(--accent)}.skin-opt i{width:18px;height:18px;border-radius:50%;display:inline-block}
.rm-wrap{display:flex;gap:6px;flex-wrap:wrap}.rm-wrap select{min-width:150px}
.statusbar{position:sticky;bottom:0;z-index:8;background:var(--head);color:var(--head-muted);font-size:12px;padding-bottom:env(safe-area-inset-bottom,0px)}
.statusbar .wrap{display:flex;flex-wrap:wrap;gap:4px 20px;padding-block:7px}
.statusbar b{color:var(--head-ink);font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.kcol h4{margin:0;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;font-size:13px}
.kcard .acts{display:flex;gap:4px;flex-wrap:wrap}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs a{display:grid;gap:2px;font-size:11.5px;color:var(--muted);text-decoration:none;max-width:110px;overflow-wrap:anywhere}
.thumbs img{width:110px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}
.filebox{width:110px;height:80px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;background:var(--panel2);font-weight:700;color:var(--ink)}
.sb-sel{background:transparent;border:1px solid var(--head-muted);color:var(--head-ink);padding:1px 6px;border-radius:6px;font-size:12px;width:auto}
.sb-sel option{color:#111}
.mini{font-size:12px;color:var(--muted)}
.perm td{text-align:center}
.perm td:first-child{text-align:start}
</style>

<div id="app" dir="rtl" lang="fa">
  <header class="top">
    <div class="wrap topin">

/* =================== ledger engine =================== */
const posted = () => S.vouchers.filter(v => !v.voided && !v.pending);
function recompute(){
  const bal=new Map();
  for(const v of posted()) for(const l of v.lines||[]){
    if(!bal.has(l.a)) bal.set(l.a,{});
    const o=bal.get(l.a); o[l.c]=(o[l.c]||0)+(l.dr||0)-(l.cr||0);
  }
  S.bal=bal;
  /* realized profit by weighted-average cost of each currency position */
  const inv={}, res=new Map();
  const I = c => inv[c] || (inv[c]={q:0,c:0});
  const acquire=(c,q,cost)=>{ const x=I(c); let p=0;
    if(x.q<-EPS){ const cov=Math.min(q,-x.q), part=cost*cov/q, avg=x.c/x.q; p=cov*avg-part; x.q+=cov; x.c+=cov*avg; q-=cov; cost-=part; if(Math.abs(x.q)<EPS){x.q=0;x.c=0} }
    if(q>EPS){ x.q+=q; x.c+=cost } return p; };
  const dispose=(c,q,proc)=>{ const x=I(c); let p=0;
    if(x.q>EPS){ const d=Math.min(q,x.q), part=proc*d/q, avg=x.c/x.q; p=part-d*avg; x.q-=d; x.c-=d*avg; q-=d; proc-=part; if(Math.abs(x.q)<EPS){x.q=0;x.c=0} }
    if(q>EPS){ x.q-=q; x.c-=proc } return p; };
  const list = posted().slice().sort((a,b)=>a.ts-b.ts || a.createdAt-b.createdAt);
  for(const v of list){
    const B=v.base||base(), rb=v.rb||{};
    const pb = c => c===B ? 1 : (rb[c] || perBase(c)/perBase(B));
    let fx=0, comm=0, inc=0, exp=0;
    if(v.type==='opening'){
      for(const l of v.lines){ if(l.a==='SYS_EQUITY' || l.c===B) continue; const q=(l.dr||0)-(l.cr||0); const cost=Math.abs(q)/pb(l.c);
        fx += q>0 ? acquire(l.c,q,cost) : dispose(l.c,-q,cost); }
    }
    if(v.type==='reval' && v.meta?.bpu){ for(const [c,bpu] of Object.entries(v.meta.bpu)){ const x=I(c); if(Math.abs(x.q)<EPS) continue; const mv=x.q*bpu; fx+=mv-x.c; x.c=mv; } }
    if(v.deal){ const d=v.deal; const V = d.ic===B ? d.ia : d.oc===B ? d.oa : d.ia/pb(d.ic);
      if(d.ic!==B) fx += acquire(d.ic, d.ia, V);
      if(d.oc!==B) fx += dispose(d.oc, d.oa, V); }
    for(const l of v.lines||[]){ const k=acc(l.a)?.kind; const x=((l.cr||0)-(l.dr||0))/pb(l.c);
      if(l.a==='SYS_COMM') comm+=x; else if(k==='income') inc+=x; else if(k==='expense') exp-=x; }
    const cb = x => x / perBase(B);
    const r = {fx:cb(fx), comm:cb(comm), inc:cb(inc), exp:cb(exp)}; r.net = r.fx + r.comm + r.inc - r.exp;
    res.set(v.id, r);
  }
  S.profits=res; S.inv=inv;
  computeStock();
}

  return e.map(([c,v])=>`<span class="chip ${v>0?'neg':'pos'}">${v>0?'بدهکار':'بستانکار'} <span class="num">${fmtBal(Math.abs(v),c)}</span> ${esc(c)}</span>`).join('');
}

const RP_KIND = {cashIn:'دریافت نقدی', chequeIn:'دریافت چک', cashOut:'پرداخت نقدی', chequeOut:'پرداخت چک'};
const BK_KIND = {deposit:'واریز به بانک', withdraw:'برداشت از بانک', xfer:'انتقال بین بانک‌ها'};
function typeLabel(v){
  const m=v.meta||{};
  switch(v.type){
    case 'exchange': return m.side==='sell' ? 'فروش ارز' : 'خرید ارز';
    case 'remitOut': return 'حواله خروجی';
    case 'remitIn': return 'حواله ورودی';
    case 'remitPay': return 'پرداخت حواله';
    case 'recpay': return RP_KIND[m.kind] || 'دریافت/پرداخت';
    case 'bank': return BK_KIND[m.kind] || 'بانک';
    case 'transfer': return m.purpose==='insteadUs' ? 'پرداخت به جای ما' : (m.ttype==='fund' ? 'انتقال بین صندوق‌ها' : 'انتقال وجه');
    case 'expense': return m.kind==='income' ? 'درآمد' : 'هزینه';
    case 'opening': return 'مانده افتتاحیه';
    case 'journal': return 'سند حسابداری';
    case 'chq': return m.action==='clear' ? 'وصول/پاس چک' : 'برگشت/ابطال چک';
  }
  return T[v.type]?.label ? T[v.type].label(v) : v.type;
}
function summaryOf(v){
  const m=v.meta||{}, M=money;
  switch(v.type){
    case 'exchange': return m.side==='sell' ? `فروش ${M(m.xa,m.x)} · دریافت ${M(m.ya,m.y)}` : `خرید ${M(m.xa,m.x)} · پرداخت ${M(m.ya,m.y)}`;
    case 'remitOut': return `${M(m.ra,m.r)} به ${esc(m.bname||'—')}${m.bcity?' ('+esc(m.bcity)+')':''}`;
    case 'remitIn': return `${M(m.ra,m.r)} برای ${esc(m.bname||'—')}`;
    case 'remitPay': return `${M(m.ra,m.r)} به ${esc(m.bname||'—')}`;
    case 'transfer': return `${M(m.amt,m.cur)} · ${esc(accName(m.from))} ← ${esc(accName(m.to))}`;
    case 'bank': return m.kind==='xfer' ? `${M(m.amt,m.cur)} از ${esc(accName(m.bank))} به ${esc(accName(m.bank2))}` : `${M(m.amt,m.cur)} · ${esc(accName(m.bank))}`;
    case 'journal': return `${(v.lines||[]).length} ردیف · ${M((v.lines||[]).reduce((s,l)=>s+(l.dr||0),0), m.cur)}`;
    case 'chq': return `چک ${esc(m.no||'')} · ${M(m.amt,m.cur)}`;
    default: return T[v.type]?.sum ? T[v.type].sum(v) : M(m.amt,m.cur);
  }
}

  if(!S.user) return;
  const need=[...new Set(ids.filter(id=>id && !(id in S.names)))]; if(!need.length) return;
  need.forEach(id=>S.names[id]='');

}

  build(){ const k=V('f_kind'), party=V('f_party'), c=V('f_cur'), amt=N('f_amt'), comm=N('f_comm'), cost=k.startsWith('cash')?N('f_cost'):0, fund=V('f_fund');

async function nextSeq(field){
  const ref=S.db.doc('counters/main');
  for(let i=0;i<12;i++){
    let r; try{ r=await ref.acquire({holder:S.holder, ttlMs:6000}); }catch(e){ r={acquired:false}; }
    if(r.acquired){ const s=await ref.get(); const d=s.exists?{...s.data()}:{}; const n=(+d[field]||0)+1; d[field]=n; await ref.set(d); return n; }
    await sleep(250+Math.random()*600);
  }
  return Math.floor(Date.now()/1000)%1000000;

async function voidVoucher(v){

function receiptLines(v){

  const Lr=[['شماره سند', fmt(v.no,'IQD')], ['تاریخ', faDate(v.ts)+' — '+faTime(v.ts)], ['نوع', typeLabel(v)]];
  if(m.title) Lr.push(['عنوان سند', m.title]); if(m.jdesc) Lr.push(['شرح سند', m.jdesc]); if(m.hidden) Lr.push(['وضعیت', 'سند مخفی']);

      if(m.comm) Lr.push([m.comm>0?'کارمزد':'تخفیف', M(Math.abs(m.comm),m.y)]);
      if(m.ben?.acc) Lr.push(['واریز به حساب', [m.ben.bank,m.ben.acc,m.ben.holder].filter(Boolean).join(' · ')]);
      break; }
    case 'remitOut': if(m.prov&&m.prov!=='agent') Lr.push(['نوع حواله', provName(m.prov)]); Lr.push(['کد حواله', m.code||'—'], ['فرستنده', m.sname||'—'], ['گیرنده', m.bname||'—']); if(m.bacc) Lr.push(['حساب گیرنده', [m.bbank,m.bacc,m.bholder].filter(Boolean).join(' · ')]); if(m.purpose) Lr.push(['بابت', m.purpose]); if(m.bphone) Lr.push(['تلفن گیرنده', m.bphone]); if(m.bcity) Lr.push(['مقصد', m.bcity]);
      Lr.push(['مبلغ حواله', M(m.ra,m.r)]); if(m.p!==m.r) Lr.push(['معادل', M(m.pa,m.p)]); Lr.push(['کارمزد', M(m.fee||0,m.p)], ['جمع دریافتی', M((m.pa||0)+(m.fee||0),m.p)], ['همکار پرداخت‌کننده', accName(m.agent)]); break;
    case 'remitIn': case 'remitPay': Lr.push(['کد حواله', m.code||'—'], ['فرستنده', m.sname||'—'], ['گیرنده', m.bname||'—']); if(m.bid) Lr.push(['مدرک گیرنده', m.bid]); Lr.push(['مبلغ', M(m.ra,m.r)]); if(v.type==='remitIn') Lr.push(['وضعیت', m.status==='paid'?'پرداخت شده':'در انتظار پرداخت']); break;
    case 'recpay': Lr.push(['مبلغ', M(m.amt,m.cur)]); if(m.cheque) Lr.push(['شماره چک', m.cheque.no], ['بانک', m.cheque.bank||'—'], ['سررسید', faDate(m.cheque.due)]); if(m.comm) Lr.push(['کارمزد', M(m.comm,m.cur)]); if(m.fund) Lr.push(['صندوق/بانک', accName(m.fund)]); break;
    case 'bank': Lr.push(['حساب بانکی', accName(m.bank)], ['مبلغ', M(m.amt,m.cur)]); if(m.kind==='xfer') Lr.push(['به', accName(m.bank2)+' — '+M(m.amt2,m.cur2)]); else Lr.push(['حساب مقابل', accName(m.src)]); if(m.ref) Lr.push(['شماره پیگیری', m.ref]); break;
    case 'transfer': Lr.push(['از', accName(m.from)], ['به', accName(m.to)], ['مبلغ', M(m.amt,m.cur)]); if(m.charge) Lr.push(['کارمزد', M(m.charge,m.cur)]); if(m.ref) Lr.push(['شماره پیگیری', m.ref]); break;
    case 'journal': (v.lines||[]).forEach(l=>Lr.push([accName(l.a), (l.dr?'بدهکار ':'بستانکار ')+M(l.dr||l.cr,l.c)+(l.d?' — '+l.d:'')])); break;
    default: Lr.push(['مبلغ', M(m.amt,m.cur)]);
  }
  if(v.party && v.party!=='WALKIN') Lr.push(['ماندهٔ حساب', balText(balOf(v.party))]);
  if(v.note) Lr.push(['شرح', v.note]);
  if(v.pending) Lr.push(['وضعیت سند', 'معلق']);
  if(v.needDocs) Lr.push(['مدارک', 'منتظر تکمیل مدارک']);
  if(v.meta?.ref && !['bank','transfer'].includes(v.type)) Lr.push(['شماره تراکنش', v.meta.ref]);
  if(v.voided) Lr.push(['وضعیت سند', 'باطل شده']);
  return Lr;
}

function alertsData(){

  return {
    rToday:cnt('in',d=>d===today), r2:cnt('in',d=>d>today&&d<=in2), rOver:cnt('in',d=>d<today),
    pToday:cnt('out',d=>d===today), p2:cnt('out',d=>d>today&&d<=in2), pOver:cnt('out',d=>d<today),
    pending:S.vouchers.filter(v=>!v.voided&&v.pending).length,
    remIn:S.vouchers.filter(v=>!v.voided&&!v.pending&&v.type==='remitIn'&&v.meta?.status==='open').length,
    remOut:S.vouchers.filter(v=>!v.voided&&!v.pending&&v.type==='remitOut'&&v.meta?.status==='open').length,
    ratesOld: !S.settingsSaved || dayKey(S.settings.ratesAt||0)!==today,

function j2g(jy,jm,jd){ jy+=1595; let days=-355668+(365*jy)+(~~(jy/33)*8)+~~(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186); let gy=400*~~(days/146097); days%=146097; if(days>36524){ gy+=100*~~(--days/36524); days%=36524; if(days>=365) days++; } gy+=4*~~(days/1461); days%=1461; if(days>365){ gy+=~~((days-1)/365); days=(days-1)%365; } let gd=days+1; const sal=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31]; let gm; for(gm=0;gm<13&&gd>sal[gm];gm++) gd-=sal[gm]; return gy+'-'+String(gm).padStart(2,'0')+'-'+String(gd).padStart(2,'0'); }

RPT.trial=()=>{ const f=S.trF||(S.trF={}); Object.assign(f,{cur:f.cur??'',lvl:f.lvl||'acc',cols:f.cols||'4',kind:f.kind??'',zero:f.zero??true,br:f.br??'all',to:f.toC||''}); const F=S.rf.from, T0=S.rf.to; const six=f.cols==='6';

  let keys=Object.keys(R); keys.forEach(k=>{ const o=R[k]; o.ob=o.od-o.oc; o.cb=o.ob+o.d-o.c; }); if(f.zero) keys=keys.filter(k=>Math.abs(R[k].cb)>1e-9);

   ${!keys.length?emptyState('سندی ثبت نشده',''):`<div class="tbl-wrap"><table><thead><tr><th rowspan="2">کد</th><th rowspan="2">حساب</th><th rowspan="2">نوع</th><th rowspan="2">ارز</th>${six?'<th colspan="2">ماندهٔ اول دوره</th>':''}<th colspan="2">${six?'گردش دوره':'گردش'}</th><th colspan="2">${six?'ماندهٔ پایان دوره':'مانده'}</th>${TC?`<th rowspan="2" class="r">معادل ماندهٔ (${esc(TC)})</th>`:''}</tr><tr>${six?'<th class="r">بدهکار</th><th class="r">بستانکار</th>':''}<th class="r">بدهکار</th><th class="r">بستانکار</th><th class="r">بدهکار</th><th class="r">بستانکار</th></tr></thead><tbody>

function readSettings(){
  SET.shop=$('#s_shop').value.trim(); SET.phone=$('#s_phone').value.trim(); SET.address=$('#s_addr').value.trim(); SET.footer=$('#s_footer').value.trim(); SET.idThreshold=parseNum($('#s_idt').value);
  readExtraSettings();
  SET.currencies.forEach((c,i)=>{ c.code=($('#s_code_'+i).value||'').trim().toUpperCase(); c.name=$('#s_name_'+i).value.trim(); c.kind=$('#s_kind_'+i)?.value||c.kind||'money'; if(c.kind==='money') delete c.kind;
    if(c.code===SET.base){ c.q='cb'; c.buy=1; c.sell=1; }
    const dv=id=>{ const v=$('#'+id)?.value; return v===''||v==null?undefined:+v; }; c.dec=dv('s_dec_'+i); c.rdec=dv('s_rdec_'+i); c.bdec=dv('s_bdec_'+i); c.noRound=!!$('#s_nr_'+i)?.checked;
    if(c.code===SET.base) return;
    const q=$('#s_q_'+i)?.value||c.q; const b=parseNum($('#s_buy_'+i)?.value), s=parseNum($('#s_sell_'+i)?.value);
    if(q!==c.q && b>0 && s>0){ c.buy=+(1/s).toPrecision(8); c.sell=+(1/b).toPrecision(8); } else { c.buy=b; c.sell=s; } c.q=q; });
}
function changeBase(nb){
  const pb=c=>{ const r=SET.currencies.find(x=>x.code===c); if(!r||c===SET.base) return 1; const m=midQ(r); return r.q==='bc'?m:1/m; };
  const k=pb(nb);
  SET.currencies.forEach(c=>{ if(c.code===nb){ c.q='cb'; c.buy=1; c.sell=1; return; }
    const m=midQ(c)||1, sp=Math.abs(((+c.sell||m)-(+c.buy||m))/(2*m)); const np=pb(c.code)/k; /* units per new base */
    const q = np>=1 ? 'bc' : 'cb'; const mid = q==='bc' ? np : 1/np;
    c.q=q; c.buy=+(mid*(1-sp)).toPrecision(7); c.sell=+(mid*(1+sp)).toPrecision(7); });
  SET.base=nb;
}
async function saveSettings(){
  if(!can('settings')) return toast('شما اجازهٔ تغییر نرخ و تنظیمات را ندارید.');
  readSettings();
  const codes=SET.currencies.map(c=>c.code);
  if(codes.some(c=>!/^[A-Z0-9][A-Z0-9_-]{1,15}$/.test(c))) return toast('کد هر ارز باید ۲ تا ۱۶ حرف یا عدد لاتین باشد (خط تیره و _ مجاز است)، مثل USD یا USD-NAJAF.');
  if(new Set(codes).size!==codes.length) return toast('کد ارز تکراری است.');
  if(SET.currencies.some(c=>c.code!==SET.base && !(c.buy>0 && c.sell>0))) return toast('نرخ خرید و فروش همهٔ ارزها باید بیشتر از صفر باشد.');

  const used=new Set(); S.vouchers.forEach(v=>(v.lines||[]).forEach(l=>used.add(l.c))); const miss=[...used].filter(c=>!codes.includes(c)); if(miss.length) return toast('ارز '+miss.join('، ')+' در اسناد استفاده شده و قابل حذف نیست.');
  if(!S.db) return toast('اتصال به پایگاه داده برقرار نیست.');
  const hist=(S.settings.rateHist||[]).slice(-199); hist.push({at:Date.now(), by:S.uid||null, r:Object.fromEntries(SET.currencies.filter(c=>c.code!==SET.base).map(c=>[c.code,[c.buy,c.sell]]))});
  try{ const doc=JSON.parse(JSON.stringify({...SET, rateHist:hist, ratesAt:Date.now(), ratesBy:S.uid||null})); await S.db.doc('app/settings').set(doc); toast('نرخ‌ها و تنظیمات ذخیره شد'); }catch(e){ writeErr(e); }
}

function computeStock(){
  const st={}; const list=posted().filter(v=>v.items?.length).sort((a,b)=>a.ts-b.ts||a.createdAt-b.createdAt);
  for(const v of list) for(const it of v.items){ const s=st[it.item]||(st[it.item]={qty:0,val:0,wh:{}}); s.qty+=it.qty; s.wh[it.wh]=(s.wh[it.wh]||0)+it.qty; s.val += it.qty>0 ? (it.cost||0) : -(it.cost||0); }
  S.stock=st;
}
function avgCost(item){ const s=S.stock[item]; if(s && s.qty>EPS && s.val>0) return s.val/s.qty; const i=catGet(item); return i?.buy ? toBase(i.buy, i.pcur||base()) : 0; }

async function jobAction(j, act){
  const st=S.settings.stages; const h=[...(j.hist||[])]; const d={...j};
  if(act==='next' && d.stage<st.length-1){ d.stage++; h.push({at:Date.now(),by:S.uid||null,txt:'انتقال به '+st[d.stage]}); }
  else if(act==='prev' && d.stage>0){ d.stage--; h.push({at:Date.now(),by:S.uid||null,txt:'برگشت به '+st[d.stage]}); }
  else if(act==='qcpass'||act==='qcfail'){ d.qc=act==='qcpass'?'pass':'fail'; h.push({at:Date.now(),by:S.uid||null,txt:'کنترل کیفیت: '+(d.qc==='pass'?'تأیید':'رد')}); }
  else if(act==='done'){
    if(d.qc==='fail') return toast('کنترل کیفیت این کار رد شده است.');
    const eq=round3(d.count*d.wpp*d.pur/GB()); const G=GC();
    const v=await makeSystemVoucher('wsdone', null, [L('JWL_VAULT',G,eq,0),L('WORKSHOP',G,0,eq)], {job:d.id,no:d.no,name:d.name,eq,count:d.count,cur:G,amt:eq}, 'تکمیل کار '+d.no);
    if(d.item){ await S.db.doc('vouchers/'+v.id).update({items:[{item:d.item,wh:'JWL',qty:d.count,cost:0}]}); }
    d.status='done'; d.doneVoucher=v.id; h.push({at:Date.now(),by:S.uid||null,txt:'تکمیل و انتقال به ویترین'}); }
  else if(act==='cancel'){ d.status='cancel'; h.push({at:Date.now(),by:S.uid||null,txt:'لغو کار'}); }
  d.hist=h; await saveWork(d); toast('انجام شد');
}

  build(){ const k=V('f_kind'), B=base(), Y=V('f_y'), wh=V('f_wh'), c=T.inv.calc(), party=V('f_party'); if(!c.rows.length) return {err:'حداقل یک کالا با تعداد وارد کنید.'};

RPT.dims=()=>{ const sec=(cat,key,title)=>{ const l=catList(cat); if(!l.length) return ''; return `<div class="panel"><h2>${title}</h2><div class="tbl-wrap"><table><thead><tr><th>کد</th><th>نام</th><th class="r">اسناد</th><th class="r">درآمد</th><th class="r">هزینه</th><th class="r">خالص</th><th class="r">بودجه</th><th class="r">مصرف بودجه</th></tr></thead><tbody>${l.map(x=>{ const vs=posted().filter(v=>inR(v)&&v[key]===x.id); let inc=0,exp=0; vs.forEach(v=>{ const p=S.profits.get(v.id); if(p){ inc+=p.fx+p.comm+p.inc; exp+=p.exp; } });

  const h=sec('project','proj','پروژه‌ها')+sec('cc','cc','مراکز هزینه')+sec('dim','dim','ابعاد شناور');
  return `<div class="panel"><h2>حسابداری چندبعدی</h2>${rangeBar()}${h?'':emptyState('پروژه، مرکز هزینه یا بعدی تعریف نشده','از بخش «مدیریت» تعریف کنید؛ سپس در هر سند می‌توانید آن را انتخاب کنید.')}</div>${h}
   <div class="panel"><h2>اسناد بدون برچسب چندبعدی</h2>${vTable(posted().filter(v=>inR(v)&&!v.proj&&!v.cc&&!v.dim&&(v.lines||[]).some(l=>['income','expense'].includes(acc(l.a)?.kind))),{limit:30})}</div>`; };
RPT.branches=()=>{ const br=[{id:'',name:'مرکزی'}].concat(catList('branch')); const B=base();
  const st=br.map(b=>{ const vs=S.vouchers.filter(v=>!v.voided&&!v.pending&&inR({...v,branch:v.branch})&&(v.branch||'')===b.id); return {b, n:vs.length, p:vs.reduce((s,v)=>s+profitOf(v),0), ex:vs.filter(v=>v.type==='exchange').length, cust:S.accounts.filter(a=>a.kind==='customer'&&(a.branch||'')===b.id&&dayKey(a.createdAt||0)>=S.rf.from&&dayKey(a.createdAt||0)<=S.rf.to).length}; });

RPT.linked=()=>{ const g=catList('lgroup'); return `<div class="panel"><h2>حساب‌های مرتبط ${S.canWrite?'<button class="btn sm" data-catnew="lgroup">گروه جدید</button>':''}</h2>${!g.length?emptyState('گروهی تعریف نشده','حساب‌های یک خانواده یا شرکت را گروه کنید تا ماندهٔ تجمیعی را ببینید.'):g.map(x=>{ const tot={}; (x.accounts||[]).forEach(id=>Object.entries(balOf(id)).forEach(([c,v])=>tot[c]=(tot[c]||0)+v)); return `<div class="box" style="margin-bottom:10px"><div class="ttl"><span class="click" data-catedit="${esc(x.id)}">${esc(x.name)}</span><span class="chips">${balChips(tot,'customer')}</span></div><div class="chips">${(x.accounts||[]).map(id=>`<span class="chip click" data-acc="${esc(id)}">${esc(accName(id))}</span>`).join('')}</div></div>`; }).join('')}</div>`; };

const KCOLS=[['todo','انجام نشده'],['doing','در حال انجام'],['done','انجام شده']];
function renderTools(){
  const t=S.toolTab||'kanban', el=$('#p-tools');
  const tabs=`<div class="panel" style="padding-bottom:10px"><div class="seg" id="tTab">${[['kanban','کانبان کارها'],['docs','مدیریت اسناد و پیوست‌ها'],['msg','پیام و ارسال مانده'],['ratehist','نرخ‌های ثبت‌شده']].map(([k,l])=>`<button type="button" data-t="${k}" aria-pressed="${k===t}">${l}</button>`).join('')}</div></div>`;
  let body='';
  if(t==='kanban'){ body=`<div class="panel"><h2>کانبان کارها ${S.canWrite?'<button class="btn sm primary" id="k_new">کار جدید</button>':''}</h2><div class="kanban">${KCOLS.map(([k,l],ci)=>{ const cs=S.kanban.filter(c=>c.col===k).sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1); return `<div class="kcol"><h4>${l} <span class="chip">${nfFa(0).format(cs.length)}</span></h4>${cs.map(c=>`<div class="kcard"><b>${esc(c.title)}</b>${c.desc?`<span class="mini">${esc(c.desc)}</span>`:''}<span class="mini">${c.assignee?'مسئول: '+esc(byName(c.assignee)):''}${c.due?' · موعد '+faDate(new Date(c.due+'T12:00')):''}</span>${S.canWrite?`<div class="acts"><button class="btn sm" data-km="${esc(c.id)}|-1" ${ci===0?'disabled':''}>→</button><button class="btn sm" data-km="${esc(c.id)}|1" ${ci===2?'disabled':''}>←</button><button class="btn sm" data-ke="${esc(c.id)}">ویرایش</button></div>`:''}</div>`).join('')}</div>`; }).join('')}</div></div>`; }
  if(t==='docs'){ const rows=[]; S.vouchers.filter(visibleV).forEach(v=>(v.attachments||[]).forEach(a=>rows.push({a,where:'سند '+fmt(v.no,'IQD')+' · '+typeLabel(v),go:`data-v="${esc(v.id)}"`}))); S.accounts.filter(canSeeAcc).forEach(x=>(x.attachments||[]).forEach(a=>rows.push({a,where:'حساب '+x.name,go:`data-acc="${esc(x.id)}"`}))); S.cat.forEach(x=>(x.attachments||[]).forEach(a=>rows.push({a,where:(CATS[x.cat]?.t||'')+' '+x.name,go:`data-catedit="${esc(x.id)}"`})));
    rows.sort((a,b)=>(b.a.at||0)-(a.a.at||0));
    body=`<div class="panel"><h2>مدیریت اسناد و پیوست‌ها ${S.canWrite?'<button class="btn sm" data-catnew="doc">سند عمومی جدید</button>':''}</h2><p class="mini" style="margin-top:0">پیوست‌ها را از داخل رسید هر سند، صفحهٔ هر حساب (تصویر و مدارک مشتری) یا «سند عمومی» اضافه کنید.</p>${!rows.length?emptyState('فایلی بارگذاری نشده',''):`<div class="tbl-wrap"><table><thead><tr><th>فایل</th><th>مربوط به</th><th>تاریخ</th><th>کاربر</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="/_blob/${esc(r.a.id)}" target="_blank" rel="noopener">${esc(r.a.name)}</a></td><td class="click" ${r.go}>${esc(r.where)}</td><td class="num">${r.a.at?faDate(r.a.at):''}</td><td>${esc(byName(r.a.by))}</td></tr>`).join('')}</tbody></table></div>`}</div>
     ${catTable('doc',[['name','عنوان'],['desc','توضیحات'],['n','فایل‌ها',x=>nfFa(0).format((x.attachments||[]).length)]],{title:'اسناد عمومی'})}`; }
  if(t==='msg'){ const m=S.msg||(S.msg={kind:'customer',filter:'debtors',group:'',tpl:'{name} عزیز، سلام.\nماندهٔ حساب شما نزد {shop} تا تاریخ {date}: {balance}\nبا تشکر'}); const G=groupMap();
    const rec=[...ACC.values()].filter(a=>(m.kind==='both'?['customer','agent']:[m.kind]).includes(a.kind)&&a.mobile&&canSeeAcc(a)&&(!m.group||(a.group||'normal')===m.group)).filter(a=>{ const tf=_mkFilter(a,m); if(tf!==null) return tf; const x=balBase(balOf(a.id)); return m.filter==='all'||(m.filter==='debtors'?x>0.01:m.filter==='creditors'?x<-0.01:Math.abs(x)>0.01); });
    const mk=a=>m.tpl.replace(/\{name\}/g,a.name).replace(/\{shop\}/g,S.settings.shop).replace(/\{date\}/g,faDate(Date.now())).replace(/\{balance\}/g,balText(balOf(a.id)));
    body=`<div class="panel"><h2>پیام و ارسال مانده حساب</h2><p class="mini" style="margin-top:0">این نرم‌افزار خودش پیامک نمی‌فرستد. برای هر گیرنده متن آماده می‌شود تا آن را کپی کنید یا در واتساپ باز کنید. ارسال‌ها در تاریخچه ثبت می‌شوند.</p>
     <div class="filters">${H.field('m_kind','گیرندگان',H.select('m_kind',[['customer','مشتریان'],['agent','همکاران'],['both','هر دو']],m.kind))}${H.field('m_filter','شرط مانده',H.select('m_filter',[['debtors','فقط بدهکاران'],['creditors','فقط بستانکاران'],['nonzero','دارای مانده'],['all','همه']],m.filter))}${H.field('m_group','گروه',H.select('m_group',[['','همه']].concat(Object.entries(G)),m.group))}</div>
     ${H.field('m_tpl','متن پیام (متغیرها: {name} {balance} {date} {shop})',`<textarea id="m_tpl">${esc(m.tpl)}</textarea>`,{wide:1})}
     <div class="actions" style="margin:10px 0"><span class="chip">${nfFa(0).format(rec.length)} گیرنده با شماره موبایل</span><button class="btn sm" id="m_all">کپی همهٔ پیام‌ها</button></div>
     ${!rec.length?emptyState('گیرنده‌ای با این شرایط نیست','شماره موبایل حساب‌ها را در مشخصات حساب وارد کنید.'):`<div class="tbl-wrap"><table><thead><tr><th>نام</th><th>موبایل</th><th>پیام</th><th></th></tr></thead><tbody>${rec.map(a=>{ const ph=(a.mobile||'').replace(/[^\d+]/g,'').replace(/^00/,'+').replace('+',''); return `<tr><td>${esc(a.name)}</td><td class="num">${esc(a.mobile)}</td><td style="white-space:pre-wrap;font-size:12.5px">${esc(mk(a))}</td><td class="nw"><button class="btn sm" data-mcopy="${esc(a.id)}">کپی</button> <a class="btn sm" href="https://wa.me/${esc(ph)}?text=${encodeURIComponent(mk(a))}" target="_blank" rel="noopener" data-mwa="${esc(a.id)}">واتساپ</a></td></tr>`; }).join('')}</tbody></table></div>`}</div>
     <div class="panel"><h2>تاریخچهٔ ارسال</h2>${!S.msglog.length?emptyState('—',''):`<div class="tbl-wrap"><table><thead><tr><th>تاریخ</th><th>گیرنده</th><th>روش</th><th>کاربر</th></tr></thead><tbody>${S.msglog.slice().sort((a,b)=>b.at-a.at).slice(0,100).map(x=>`<tr><td class="num">${faDate(x.at)} ${faTime(x.at)}</td><td>${esc(accName(x.to))}</td><td>${x.ch==='wa'?'واتساپ':'کپی'}</td><td>${esc(byName(x.by))}</td></tr>`).join('')}</tbody></table></div>`}</div>`;
    S._mk=mk; S._rec=rec; }
  if(t==='ratehist'){ const h=(S.settings.rateHist||[]).slice().reverse(); body=`<div class="panel"><h2>تاریخچهٔ نرخ‌های ثبت‌شده</h2>${!h.length?emptyState('هنوز تاریخچه‌ای ثبت نشده','با هر ذخیرهٔ نرخ، یک ردیف اینجا اضافه می‌شود.'):`<div class="tbl-wrap"><table><thead><tr><th>زمان</th><th>کاربر</th>${S.settings.currencies.filter(c=>c.code!==base()).map(c=>`<th class="r">${esc(c.code)}</th>`).join('')}</tr></thead><tbody>${h.map(r=>`<tr><td class="num nw">${faDate(r.at)} ${faTime(r.at)}</td><td>${esc(byName(r.by))}</td>${S.settings.currencies.filter(c=>c.code!==base()).map(c=>`<td class="r num nw">${r.r?.[c.code]?fmtRate(r.r[c.code][0])+' / '+fmtRate(r.r[c.code][1]):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}</div>`; }
  el.innerHTML=tabs+body;
  $('#tTab').onclick=e=>{ const b=e.target.closest('button'); if(b){ S.toolTab=b.dataset.t; renderTools(); } };
  if($('#k_new')) $('#k_new').onclick=()=>kanbanForm();
  $$('[data-ke]').forEach(b=>b.onclick=()=>kanbanForm(S.kanban.find(c=>c.id===b.dataset.ke)));
  $$('[data-km]').forEach(b=>b.onclick=async()=>{ const [id,d]=b.dataset.km.split('|'); const c=S.kanban.find(x=>x.id===id); const i=KCOLS.findIndex(x=>x[0]===c.col)+(+d); if(i<0||i>2) return; try{ await S.db.doc('kanban/'+id).update({col:KCOLS[i][0], movedAt:Date.now()}); }catch(e){ writeErr(e); } });
  if(t==='msg'){ ['m_kind','m_filter','m_group'].forEach(k=>$('#'+k).onchange=e=>{ S.msg[k.slice(2)]=e.target.value; renderTools(); }); $('#m_tpl').onchange=e=>{ S.msg.tpl=e.target.value; renderTools(); };
    const log=async(to,ch)=>{ try{ await S.db.collection('msglog').doc(rid('M')).set({to,ch,at:Date.now(),by:S.uid||null}); }catch(e){} };
    $$('[data-mcopy]').forEach(b=>b.onclick=()=>{ const a=acc(b.dataset.mcopy); copyText(S._mk(a)); log(a.id,'copy'); });

    if($('#m_all')) $('#m_all').onclick=()=>copyText(S._rec.map(a=>a.name+' ('+a.mobile+')\n'+S._mk(a)).join('\n\n----------\n\n')); }
}
function kanbanForm(c){
  c=c||{col:'todo'}; const users=S.users.map(u=>u.uid).filter(Boolean);
  openModal(`<div class="row" style="margin-bottom:12px"><h3>${c.id?'ویرایش کار':'کار جدید'}</h3><button class="btn sm" data-close>بستن</button></div>
   <form id="kForm" class="form">${H.field('k_title','عنوان',H.input('k_title',c.title||''),{wide:1})}${H.field('k_desc','توضیحات',H.input('k_desc',c.desc||''),{wide:1})}
   ${H.field('k_as','مسئول',H.select('k_as',[['','—']].concat(users.map(u=>[u,byName(u)])),c.assignee||''))}${H.field('k_due','موعد',H.input('k_due',c.due||'',{type:'date'}))}${H.field('k_col','ستون',H.select('k_col',KCOLS,c.col))}
   <div class="field wide"><div class="actions"><button class="btn primary" type="submit">ذخیره</button>${c.id?'<button type="button" class="btn danger" id="k_del">حذف</button>':''}</div></div></form>`);
  $('#kForm').onsubmit=async e=>{ e.preventDefault(); const d={...c, title:$('#k_title').value.trim(), desc:$('#k_desc').value.trim(), assignee:$('#k_as').value, due:$('#k_due').value, col:$('#k_col').value}; if(!d.title) return toast('عنوان را بنویسید.');
    try{ d.id=d.id||rid('K'); d.createdAt=d.createdAt||Date.now(); d.by=d.by||S.uid||null; await S.db.collection('kanban').doc(d.id).set(JSON.parse(JSON.stringify(d))); closeModal(); }catch(err){ writeErr(err); } };
  if($('#k_del')) armButton($('#k_del'),'تأیید حذف؟',async()=>{ try{ await S.db.doc('kanban/'+c.id).delete(); closeModal(); }catch(e){ writeErr(e); } });
}

function groupMap(){ const g={...DEFAULTS.groups, ...(S.settings.groups||{})}; catList('cgroup').filter(x=>x.active!==false).sort((a,b)=>(a.prio||0)-(b.prio||0)).forEach(x=>g[x.id]=x.name); return g; }
function dataLists(){
  const cities=new Set(), countries=new Set(); catList('country').forEach(c=>{ countries.add(c.name); String(c.cities||'').split(/[,،]/).map(x=>x.trim()).filter(Boolean).forEach(x=>cities.add(x)); });
  S.accounts.forEach(a=>{ if(a.city) cities.add(a.city); if(a.nat) countries.add(a.nat); if(a.country) countries.add(a.country); });
  S.vouchers.slice(0,400).forEach(v=>{ if(v.meta?.bcity) cities.add(v.meta.bcity); });
  const labs=new Set(catList('lab').filter(l=>l.active!==false).map(l=>l.name)); S.vouchers.slice(0,400).forEach(v=>{ if(v.meta?.lab) labs.add(v.meta.lab); });
  const pg=new Set(catList('pgroup').map(g=>g.name)); catList('item').forEach(i=>{ if(i.group) pg.add(i.group); });
  const purp=['هزینهٔ زندگی','شهریهٔ دانشجویی','درمان','خرید کالا','سرمایه‌گذاری','کمک به خانواده','بازپرداخت بدهی','سفر'];
  const dl=(id,set)=>`<datalist id="${id}">${[...set].map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`;
  return dl('dl_cities',cities)+dl('dl_countries',countries)+dl('dl_labs',labs)+dl('dl_pgroups',pg)+dl('dl_purpose',new Set(purp));

function nextRemitCode(agentId){ const a=acc(agentId); const pre=a?.remitPrefix||''; const start=+a?.remitStart||1;
  let mx=start-1; S.vouchers.forEach(v=>{ if(v.type==='remitOut' && v.meta?.agent===agentId && String(v.meta.code||'').startsWith(pre)){ const n=parseInt(String(v.meta.code).slice(pre.length),10); if(n>mx) mx=n; } }); return pre+String(mx+1); }
function myCash(){ if(myOpt().defCash && acc(myOpt().defCash)) return myOpt().defCash; const c=[...ACC.values()].find(a=>a.kind==='cash' && a.active!==false && (a.users||[]).includes(S.uid)); return c?.id || catGet(S.branch)?.defCash || 'CASH1'; }
const INV_TYPES = v => (v.type==='oil') || (v.type==='tmsbill') || (v.type==='inv' && ['sale','purchase'].includes(v.meta?.kind)) || (v.type==='jewelry');
function invPaid(v){ return S.vouchers.filter(x=>!x.voided && !x.pending && x.meta?.invref===v.id).reduce((s,x)=>s+(x.meta.cur===(v.meta.y||v.meta.cur)?x.meta.amt:toBase(x.meta.amt,x.meta.cur)*perBase(v.meta.y||v.meta.cur)),0); }
function payStatus(v){ const m=v.meta||{}; const onAcc = v.type==='tmsbill' || (m.recvM||'')==='party' || (m.payM||'')==='party' || (v.type==='oil' && ((v.f?.f_in_m||v.f?.f_out_m)==='party')) || (v.type==='inv' && ((v.f?.f_in_m||v.f?.f_out_m)==='party'));
  if(!onAcc) return 'full'; const paid=invPaid(v), tot=m.total||0; if(paid<=0.005) return 'waiting'; if(paid < tot-0.005) return 'partial'; if(paid > tot+0.005) return 'over'; return 'full'; }
const PSL = {waiting:'در انتظار پرداخت',partial:'پرداخت ناقص',full:'تسویه',over:'اضافه پرداخت'};
const payStatusLabel = v => PSL[payStatus(v)];
const payChip = v => { const p=payStatus(v); return `<span class="chip ${p==='full'?'pos':p==='over'?'info':p==='partial'?'warn':'neg'}">${PSL[p]}</span>`; };
function openInvoices(party){ if(!party) return []; return S.vouchers.filter(v=>!v.voided && !v.pending && INV_TYPES(v) && v.party===party && payStatus(v)!=='full' && payStatus(v)!=='over').slice(0,40); }

function logAct(type, desc, vid){ if(!S.db||!S.uid||!S.canWrite) return; _actQ.push({t:Date.now(), type, desc:String(desc||'').slice(0,160), vid:vid||null, br:S.branch||''}); clearTimeout(_actT); _actT=setTimeout(flushAct,1500); }
async function flushAct(){ if(!_actQ.length) return; const day=dayKey(Date.now()), id=S.uid+'_'+day; const cur=S.actlog.find(d=>d.id===id); const ev=[...(cur?.ev||[]), ..._actQ].slice(-400); _actQ=[];
  try{ await S.db.collection('actlog').doc(id).set({uid:S.uid, day, ev}); }catch(e){} }

/* =================== daily payment limit per customer (branch setting) =================== */
function checkPayLimit(r){ const br=catGet(S.branch); const lim=+br?.payLimit||0; if(!lim||!r.party||!PARTY.includes(acc(r.party)?.kind)) return null;
  const funds=new Set([...ACC.values()].filter(a=>FUNDS.includes(a.kind)).map(a=>a.id)); const today=dayKey(Date.now());
  const out=lines=>lines.filter(l=>funds.has(l.a)).reduce((s,l)=>s+toBase(l.cr||0,l.c),0);
  const now=out(r.lines); if(!now) return null;
  const prev=posted().filter(v=>v.party===r.party&&dayKey(v.ts)===today&&(v.branch||'')===(S.branch||'')&&v.id!==S.editing?.id).reduce((s,v)=>s+out(v.lines||[]),0);
  return prev+now>lim ? `پرداخت امروز به این مشتری در این شعبه به ${fmt(prev+now,base())} ${base()} می‌رسد که از سقف روزانهٔ شعبه (${fmt(lim,base())}) بیشتر است. برای تأیید دوباره «ثبت» را بزنید.` : null; }

function todayHTML(){ const t=dayKey(Date.now()), B=base(); const L=posted().filter(v=>dayKey(v.ts)===t&&visibleV(v));
  const fx={}; L.filter(v=>v.type==='exchange').forEach(v=>{ const m=v.meta; const o=fx[m.x+'/'+m.y]||(fx[m.x+'/'+m.y]={x:m.x,y:m.y,bq:0,by:0,sq:0,sy:0,n:0}); o.n++; if(m.side==='buy'){o.bq+=m.xa;o.by+=m.ya}else{o.sq+=m.xa;o.sy+=m.ya} });
  const funds=new Set([...ACC.values()].filter(a=>FUNDS.includes(a.kind)).map(a=>a.id)); const cf={}; L.forEach(v=>(v.lines||[]).forEach(l=>{ if(!funds.has(l.a)) return; const o=cf[l.c]||(cf[l.c]={i:0,o:0}); o.i+=l.dr||0; o.o+=l.cr||0; }));
  const vol={}; L.forEach(v=>{ if(!v.party||v.party==='WALKIN') return; vol[v.party]=(vol[v.party]||0)+toBase(v.meta?.amt||0,v.meta?.cur||B); }); const top=Object.entries(vol).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const hrs=Array(24).fill(0); L.forEach(v=>hrs[new Date(v.ts).getHours()]++); const mx=Math.max(1,...hrs);
  const ro=L.filter(v=>v.type==='remitOut'), ri=L.filter(v=>v.type==='remitIn');
  const rate=(o,side)=>{ const q=side==='b'?o.bq:o.sq, y=side==='b'?o.by:o.sy; if(!q) return '—'; const r=y/q; return r>=1?'× '+fmtR(o.y,r):'÷ '+fmtR(o.y,1/r); };
  return `<div class="panel"><h2>وضعیت امروز <span class="sub">${faLong(Date.now())}</span></h2>
   <div class="grid2"><div>${!Object.keys(fx).length?emptyState('خرید و فروشی امروز ثبت نشده',''):`<div class="tbl-wrap"><table><thead><tr><th>جفت ارز</th><th class="r">خرید</th><th class="r">میانگین نرخ خرید</th><th class="r">فروش</th><th class="r">میانگین نرخ فروش</th><th class="r">دفعات</th></tr></thead><tbody>${Object.values(fx).map(o=>`<tr><td class="nw">${curFlag(o.x)} ${esc(o.x)} / ${esc(o.y)}</td><td class="r num pos">${fmt(o.bq,o.x)}</td><td class="r num">${rate(o,'b')}</td><td class="r num neg">${fmt(o.sq,o.x)}</td><td class="r num">${rate(o,'s')}</td><td class="r num">${nfFa(0).format(o.n)}</td></tr>`).join('')}</tbody></table></div>`}</div>
    <div>${!Object.keys(cf).length?emptyState('گردش صندوقی امروز نیست',''):`<div class="tbl-wrap"><table><thead><tr><th>ارز</th><th class="r">ورود به صندوق/بانک</th><th class="r">خروج</th><th class="r">خالص</th></tr></thead><tbody>${Object.entries(cf).map(([c,o])=>`<tr><td>${curFlag(c)} ${esc(c)}</td><td class="r num pos">${fmt(o.i,c)}</td><td class="r num neg">${fmt(o.o,c)}</td><td class="r num">${fmt(o.i-o.o,c)}</td></tr>`).join('')}</tbody></table></div>`}</div></div>
   <div class="grid2" style="margin-top:14px"><div><h4 style="margin:0 0 6px;font-size:13px">بیشترین حجم معامله امروز</h4>${top.length?`<div class="chips">${top.map(([id,x])=>`<span class="chip click" data-acc="${esc(id)}">${esc(accName(id))}: <span class="num">${fmt(x,B)}</span> ${esc(B)}</span>`).join('')}</div>`:'<span class="mini">—</span>'}
     <div class="chips" style="margin-top:10px"><span class="chip">حوالهٔ خروجی امروز: <span class="num">${nfFa(0).format(ro.length)}</span></span><span class="chip">حوالهٔ ورودی امروز: <span class="num">${nfFa(0).format(ri.length)}</span></span><span class="chip">کل اسناد امروز: <span class="num">${nfFa(0).format(L.length)}</span></span></div></div>
    <div><h4 style="margin:0 0 6px;font-size:13px">تعداد اسناد بر حسب ساعت</h4><svg class="chart" viewBox="0 0 480 90" role="img" aria-label="تعداد اسناد امروز بر حسب ساعت">${hrs.map((n,h)=>`<rect x="${h*20+2}" y="${70-n/mx*60}" width="16" height="${Math.max(n?2:0,n/mx*60)}" rx="2" fill="var(--accent)"><title>ساعت ${h}: ${n}</title></rect>`).join('')}${[0,6,12,18,23].map(h=>`<text x="${h*20+10}" y="86" text-anchor="middle">${nfFa(0).format(h)}</text>`).join('')}</svg></div></div></div>`; }

const PBASIS=[['t','هر تن'],['bbl','هر بشکه'],['l','هر لیتر'],['gal','هر گالن']];
function dualSide(p,title,who,acct){ const o=S.settings.oil||{}; return `<div class="box"><div class="ttl">${title}</div><div class="form">

  ${H.field('f_'+p+'pu','نوع قیمت',H.select('f_'+p+'pu',PBASIS,(p==='a'?o.buyPu:o.sellPu)||'t'))}${H.field('f_'+p+'pc','ارز قیمت',H.select('f_'+p+'pc',moneyOpts(),base()))}${H.field('f_'+p+'pr','قیمت واحد',H.input('f_'+p+'pr','',{num:1}))}
  ${H.field('f_'+p+'sc','در مقابل (ارز تسویه)',H.select('f_'+p+'sc',moneyOpts(),base()))}${H.field('f_'+p+'k','نرخ تبدیل ارز',`<div class="ratebox">${H.select('f_'+p+'kop',OPS,'*')}${H.input('f_'+p+'k','1',{num:1})}</div>`)}
  ${H.field('f_'+p+'tot','مجموع (ارز تسویه)',H.input('f_'+p+'tot','',{num:1,ro:1}))}${H.field('f_'+p+'tn','معادل تنی',H.input('f_'+p+'tn','',{num:1,ro:1}))}${H.field('f_'+p+'bt','جمع کل ('+esc(base())+')',H.input('f_'+p+'bt','',{num:1,ro:1}))}
  ${H.field('f_'+p+'d','شرح '+(p==='a'?'خرید':'فروش'),H.input('f_'+p+'d',''),{wide:1})}</div></div>`; }
function dualCalc(p){ const q=N('f_'+p+'q'), u=V('f_'+p+'u'), t=toTons(q,u), qpu=fromTons(t,V('f_'+p+'pu')); const pv=qpu*N('f_'+p+'pr'); const SC=V('f_'+p+'sc');
  const tot=V('f_'+p+'pc')===SC ? pv : applyRate(pv,V('f_'+p+'kop'),N('f_'+p+'k')); return {q,u,t,tot:+(tot||0).toFixed(decOf(SC)),SC}; }
T.dualoil = {
  label:()=>'معاملهٔ دوگانهٔ نفت',
  sum:v=>{ const m=v.meta; return `${fmt(m.tons,OC())} تن · ${esc(accName(m.a))} ← ${esc(accName(m.b))} · سود ${m.prB!=null?money(m.prB,base()):money((m.yb||0)-(m.ya||0),m.y)}`; },
  form(p){ return `${H.field('f_kind','نوع معامله',H.input('f_kind',p.kind||'',{ph:'مثلاً گازوئیل، نفت سفید…'}))}${H.field('f_pcar','شناور طرف (تحویل‌گیرنده)',H.select('f_pcar',[['','—']].concat(catList('pcarrier').map(c=>[c.id,c.name])),''))}${H.field('f_svc','سرویس بارگیری',H.select('f_svc',[['','—']].concat(catList('service').map(c=>[c.id,c.name])),''))}${H.field('f_invno','شمارهٔ فاکتور',H.input('f_invno','',{ltr:1}))}
    ${dualSide('b','فروش به (خریدار)','فروش به',p.b)}${dualSide('a','خرید از (فروشنده)','خرید از',p.a)}
    <div class="field wide"><div class="calc" id="calc"></div></div>${dateBox()}${footBox()}`; },
  wire(){ const setBal=p=>{ const same=V('f_'+p+'pc')===V('f_'+p+'sc'); $('#f_'+p+'k').disabled=same; $('#f_'+p+'kop').disabled=same; };
    const upd=()=>{ const r={}; for(const p of ['a','b']){ const c=dualCalc(p); r[p]=c; $('#f_'+p+'tot').value=c.tot?enNum(c.tot):''; $('#f_'+p+'tn').value=c.t?enNum(+c.t.toFixed(3)):''; $('#f_'+p+'bt').value=c.tot?enNum(+toBase(c.tot,c.SC).toFixed(decOf(base()))):''; }
      const prB=toBase(r.b.tot,r.b.SC)-toBase(r.a.tot,r.a.SC), dq=r.b.t-r.a.t, T=r.b.t||r.a.t;
      $('#calc').innerHTML = T>0 ? `معادل: <b class="num">${fmt(T,OC())}</b> تن · <b class="num">${fmt(fromTons(T,'bbl'),'USD')}</b> بشکه · <b class="num">${fmt(fromTons(T,'gal'),'USD')}</b> گالن · <b class="num">${fmt(fromTons(T,'l'),'IQD')}</b> لیتر<br>سود/زیان معامله: <b class="${prB>=0?'pos':'neg'}">${money(prB,base())}</b>${Math.abs(dq)>0.0005&&r.a.t&&r.b.t?` <span class="chip warn">اختلاف مقدار خرید و فروش: ${fmt(dq,OC())} تن</span>`:''}` : '<span class="muted">مقدار و قیمت‌ها را وارد کنید.</span>'; };
    const ref=p=>{ const PC=V('f_'+p+'pc'), SC=V('f_'+p+'sc'), pu=V('f_'+p+'pu'); const k=pu==='t'?1:1/fromTons(1,pu); const [o,r]=rateUI(null,OC(),PC,p==='a'?'buy':'sell'); $('#f_'+p+'pr').value=enNum(+((o==='/'?1/r:r)*k).toPrecision(8));
      if(PC===SC){ $('#f_'+p+'kop').value='*'; $('#f_'+p+'k').value='1'; } else { const [o2,r2]=rateUI(null,PC,SC,p==='a'?'buy':'sell'); $('#f_'+p+'kop').value=o2; $('#f_'+p+'k').value=enNum(r2); } upd(); };
    $('#vform').addEventListener('input',e=>{ if(e.target.id==='f_aq'&&!$('#f_bq').dataset.t){ $('#f_bq').value=$('#f_aq').value; } if(e.target.id==='f_bq') $('#f_bq').dataset.t=1; upd(); });
    for(const p of ['a','b']){ ['u','kop'].forEach(k=>$('#f_'+p+k).addEventListener('change',upd)); ['pc','sc','pu'].forEach(k=>$('#f_'+p+k).addEventListener('change',()=>ref(p))); ['pc','sc'].forEach(k=>$('#f_'+p+k).addEventListener('change',()=>setBal(p))); setBal(p); ref(p); } },
  build(){ const a=V('f_a'), b=V('f_b'); if(!a||!b||a===b) return {err:'«خرید از» و «فروش به» را درست انتخاب کنید.'};
    const A=dualCalc('a'), B=dualCalc('b'); if(!(A.t>0)||!(B.t>0)) return {err:'مقدار خرید و فروش را وارد کنید.'}; if(!(A.tot>0&&B.tot>0)) return {err:'قیمت‌ها را وارد کنید.'};
    const lines=[L(b,B.SC,B.tot,0), L(a,A.SC,0,A.tot)];
    if(A.SC===B.SC){ const pr=+(B.tot-A.tot).toFixed(decOf(A.SC)); if(pr) lines.push(pr>0?L('INC_DUAL',A.SC,0,pr):L('INC_DUAL',A.SC,-pr,0)); }
    else lines.push(L('SYS_POS',B.SC,0,B.tot), L('SYS_POS',A.SC,A.tot,0));
    const dq=round3(A.t-B.t); if(Math.abs(dq)>0.0005) return {err:'مقدار خرید و فروش (به تن) باید برابر باشد؛ اختلاف '+fmt(dq,OC())+' تن است.'};
    const side=p=>({q:N('f_'+p+'q'),u:V('f_'+p+'u'),pu:V('f_'+p+'pu'),pc:V('f_'+p+'pc'),pr:N('f_'+p+'pr'),sc:V('f_'+p+'sc'),kop:V('f_'+p+'kop'),k:N('f_'+p+'k'),d:V('f_'+p+'d').trim()});
    const prB=+(toBase(B.tot,B.SC)-toBase(A.tot,A.SC)).toFixed(decOf(base()));
    return {party:b, lines, meta:{kind:V('f_kind').trim(),tons:round3(A.t),a,b,A:side('a'),B:side('b'),ya:A.tot,yb:B.tot,ca:A.SC,cb:B.SC,y:B.SC,prB,pcar:V('f_pcar'),svc:V('f_svc'),invno:V('f_invno').trim(),cur:B.SC,amt:B.tot,total:B.tot}}; }
};

function loginAlertData(n){ const d0=dayKey(Date.now()), dn=dayKey(Date.now()+n*864e5);

  const bucket=(list,dueOf)=>{ const o={today:[],over:[],next:[]}; list.forEach(v=>{ const d=dueOf(v); if(!d) return; const k=dayKey(d); if(k===d0) o.today.push(v); else if(k<d0) o.over.push(v); else if(k<=dn) o.next.push(v); }); return o; };
  const due=[...S.vouchers.filter(v=>!v.voided && !v.pending && ((v.type==='remitOut'||v.type==='remitIn')&&v.meta?.status==='open'&&v.meta.due)).map(v=>({k:'v',v,d:new Date(v.meta.due+'T12:00').getTime()})),

    ...S.orders.filter(o=>o.kind==='chorder'&&o.status==='open'&&o.due).map(o=>({k:'o',o,d:new Date(o.due+'T12:00').getTime()}))];
  const ch=S.vouchers.filter(v=>!v.voided && v.type==='charter' && v.meta?.status==='active' && v.meta.end);
  let lb=0; try{ lb=+localStorage.getItem('sarrafi_lastbackup')||0; }catch(e){}

/* order pricing: rate × basis-qty × trips (+ fuel surcharge) or the approved quote */
function orderPrice(o){ const q=o.quote&&tmsGet(o.quote); if(q&&q.status==='approved') return {...quoteTotal(q), cur:q.cur, src:'quote'};
  const cur=o.cur||tSet().cur, trips=Math.max(1,+o.trips||1), bq=o.rbasis==='km'?(+o.bqty||catGet(o.route)?.km||0):o.rbasis==='hour'?(+o.bqty||0):1; const fuel=+o.fuel||0;
  const sub=(+o.rate||0)*bq*(o.rbasis==='flat'?1:trips)*(1+fuel/100); const tax=sub*(+o.vat||0)/100; return {sub:+sub.toFixed(decOf(cur)), tax:+tax.toFixed(decOf(cur)), total:+(sub+tax).toFixed(decOf(cur)), cur, src:'order'}; }
function findRateCard(o){ const cs=catList('ratecard').filter(r=>r.active!==false && (!r.from||r.from===o.from) && (!r.to||r.to===o.to) && (!r.vtype||r.vtype===o.vtype));
  const ctr=catList('tcontract').filter(c=>c.cust===o.cust && c.cstatus==='active' && (!c.end||c.end>=dayKey(Date.now()))).map(c=>c.id);
  return cs.find(r=>r.contract&&ctr.includes(r.contract)) || cs.find(r=>!r.contract) || null; }
const billOf=o=>o.bill&&S.vouchers.find(v=>v.id===o.bill&&!v.voided);
const tripsOf=o=>tmsList('trip').filter(t=>(t.orders||[]).includes(o.id));
const tripCost=t=>S.vouchers.filter(v=>v.type==='tmscost'&&!v.voided&&v.meta.trip===t.id).reduce((s,v)=>s+toBase(v.meta.amt,v.meta.cur),0);
function tripRevenue(t){ return (t.orders||[]).map(tmsGet).filter(Boolean).reduce((s,o)=>{ const p=orderPrice(o); const n=Math.max(1,tripsOf(o).length); const b=billOf(o); return s+toBase(b?b.meta.sub:p.sub,b?b.meta.cur:p.cur)/n; },0); }
/* compliance & readiness */
function compliance(t){ const now=dayKey(Date.now()), v=catGet(t.vehicle), d=catGet(t.driver); const dr=[], vr=[];
  if(!d) dr.push('راننده تعیین نشده'); else { if(d.licEnd&&d.licEnd<now) dr.push('گواهینامه منقضی'); if(d.visaEnd&&d.visaEnd<now) dr.push('اقامت منقضی'); if(d.dstatus&&d.dstatus!=='ok') dr.push('راننده آماده نیست'); }
  if(!v) vr.push('خودرو تعیین نشده'); else { if(v.insEnd&&v.insEnd<now) vr.push('بیمه منقضی'); if(v.regEnd&&v.regEnd<now) vr.push('کارت خودرو منقضی'); if(v.vstatus&&v.vstatus!=='ok') vr.push(v.vstatus==='maint'?'در تعمیر':'خارج از سرویس'); if(v.nextMaint&&v.nextMaint<now) vr.push('سرویس دوره‌ای عقب افتاده'); }
  const busy=tmsList('trip').some(x=>x.id!==t.id && ['dispatched','loading','transit','arrived'].includes(x.status) && (x.vehicle===t.vehicle||x.driver===t.driver)); if(busy) vr.push('خودرو یا راننده در سفر دیگری است');
  return {ok:!dr.length&&!vr.length, dr, vr}; }
const okChip=(ok,why)=>ok?'<span class="chip pos">آماده</span>':`<span class="chip neg" title="${esc(why.join('، '))}">${esc(why[0]||'')}${why.length>1?' +'+nfFa(0).format(why.length-1):''}</span>`;
/* billing eligibility & receivables */
function eligibility(o){ if(['cancelled','new','quoted'].includes(o.status)) return [false,'سفارش تأیید نشده']; if(billOf(o)) return [false,'صورت‌حساب شده']; const tr=tripsOf(o);
  if(o.smode==='period'||o.smode==='limit'||o.smode==='contract') return [true,'طبق شیوهٔ تسویه'];
  if(!tr.length) return [false,'سفری برنامه‌ریزی نشده']; if(tr.length<(+o.trips||1)) return [false,'همهٔ سرویس‌ها برنامه‌ریزی نشده']; if(!tr.every(t=>['delivered','closed'].includes(t.status))) return [false,'تحویل همهٔ سرویس‌ها کامل نشده'];
  if(o.pod && !o.podOk) return [false,'رسید تحویل (POD) ثبت نشده']; return [true,'آمادهٔ صورت‌حساب']; }
function receivable(v){ const paid=invPaid(v), tot=v.meta.total||0, due=v.meta.due||dayKey(v.ts+(tSet().terms||30)*864e5); const out=+(tot-paid).toFixed(2); const od=out>0.005?Math.floor((Date.now()-new Date(due+'T12:00').getTime())/864e5):0; return {paid,out,due,od:Math.max(0,od)}; }
const aging=d=>d<=0?'جاری':d<=30?'۱ تا ۳۰ روز':d<=60?'۳۱ تا ۶۰ روز':d<=90?'۶۱ تا ۹۰ روز':'بیش از ۹۰ روز';

T.tmsbill={ label:()=>'صورت‌حساب حمل', sum:v=>`${esc(v.meta.ono?'سفارش '+v.meta.ono:'')} · ${money(v.meta.total,v.meta.cur)}` };
T.tmscost={ label:()=>'هزینهٔ سفر', sum:v=>`سفر ${esc(v.meta.tno||'')} · ${esc(v.meta.ctype||'')} · ${money(v.meta.amt,v.meta.cur)}` };
PERM_OF.tmsbill='tms.bill'; PERM_OF.tmscost='tms.trip';

const qChip=q=>`<span class="chip ${q.status==='approved'?'pos':q.status==='rejected'?'neg':q.status==='pending'?'warn':''}">${tName(TMS_QST,q.status)}</span>`;
const oChip=o=>`<span class="chip ${['billed','closed'].includes(o.status)?'pos':o.status==='cancelled'?'neg':o.status==='delivered'?'warn':''}">${tName(TMS_OST,o.status)}</span>${o.exStatus==='pending'?' <span class="chip warn">منتظر تأیید استثنا</span>':''}`;
const trChip=t=>`<span class="chip ${t.status==='closed'?'pos':['dispatched','loading','transit','arrived'].includes(t.status)?'warn':''}">${tName(TMS_TST,t.status)}</span>`;
const dd=k=>k?faDate(new Date(k+'T12:00')):'—';

function tmsQueues(){ const now=dayKey(Date.now()), o=tmsList('order'), t=tmsList('trip');
  return { draft:o.filter(x=>x.status==='new'), assign:o.filter(x=>['approved','scheduled'].includes(x.status)&&tripsOf(x).length<(+x.trips||1)), active:t.filter(x=>['dispatched','loading','transit','arrived'].includes(x.status)),
    quotes:tmsList('quote').filter(x=>['sent','pending'].includes(x.status)), ex:[...o.filter(x=>x.exStatus==='pending'), ...tmsList('quote').filter(x=>x.status==='pending')],
    attn:[...o.filter(x=>!['delivered','billed','closed','cancelled'].includes(x.status)&&((x.pickup&&x.pickup<now&&!tripsOf(x).length)||(x.deliv&&x.deliv<now))), ...t.filter(x=>!['delivered','closed'].includes(x.status)&&x.date&&x.date<now&&x.status==='planned')] }; }

  if(t==='orders') body=orderListHTML();

    + catTable('vehicle',[['name','پلاک'],['vtype','نوع'],['cap','تن'],['vstatus','وضعیت',x=>({ok:'آماده',maint:'در تعمیر',out:'خارج از سرویس'})[x.vstatus||'ok']],['nextMaint','سرویس بعدی',x=>dd(x.nextMaint)],['regEnd','کارت خودرو',x=>dd(x.regEnd)],['insEnd','بیمه',x=>dd(x.insEnd)]],{title:'دارایی‌های ناوگان'})
    + catTable('driver',[['code','کد'],['name','نام'],['mobile','موبایل'],['licEnd','گواهینامه تا',x=>dd(x.licEnd)],['visaEnd','اقامت تا',x=>dd(x.visaEnd)],['fleet','خودرو',x=>esc(x.fleet?catName(x.fleet):'—')]],{title:'رانندگان'})
    + catTable('tloc',[['name','مکان'],['ltype','نوع',x=>tName(CATS.tloc.f[1][3],x.ltype)],['zone','منطقه'],['city','شهر']],{title:'مناطق و مکان‌ها'})
    + catTable('route',[['name','مسیر'],['from','مبدأ'],['to','مقصد'],['km','کیلومتر'],['toll','عوارض'],['minRate','حداقل کرایه',x=>x.minRate?money(x.minRate,x.rcur||base()):'—']],{title:'مسیرها و عوارض'})
    + catTable('ratecard',[['name','عنوان'],['contract','قرارداد',x=>esc(x.contract?catName(x.contract):'عمومی')],['from','مبدأ'],['to','مقصد'],['vtype','خودرو'],['basis','مبنا',x=>tName(RBASIS,x.basis)],['rate','نرخ',x=>money(x.rate||0,x.rcur||base())],['fuel','سوخت ٪']],{title:'کارت‌های نرخ'})

  if(t==='audit'){ const ev=[]; S.tms.forEach(d=>(d.hist||[]).forEach(h=>ev.push({...h,d}))); ev.sort((a,b)=>b.at-a.at);

  el.innerHTML=`<div class="panel" style="padding-bottom:10px"><div class="seg" id="tmsTab">${tabs.map(([k,l])=>`<button type="button" data-t="${k}" aria-pressed="${k===t}">${l}</button>`).join('')}</div>
    ${S.canWrite?`<div class="actions" style="margin-top:10px">${can('tms.order')?'<button class="btn sm" data-qa="order">سفارش حمل جدید</button>':''}${can('tms.quote')?'<button class="btn sm" data-qa="quote">پیش‌فاکتور / محاسبهٔ نرخ</button>':''}${can('tms.trip')?'<button class="btn sm" data-qa="plan">برنامه‌ریزی سفرها</button>':''}${can('recpay')?'<button class="btn sm" data-qa="pay">دریافت وجه مشتری</button>':''}</div>`:''}</div>${body}`;
  $('#tmsTab').onclick=e=>{ const b=e.target.closest('button'); if(b){ S.tmsTab=b.dataset.t; renderTms(); } };

  if($('#tt_new')) $('#tt_new').onclick=()=>tripDialog(null);

}
function barList(l){ const mx=Math.max(1,...l.map(x=>x[1])); return l.map(([n,v])=>`<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="flex:0 0 150px;font-size:13px">${esc(n)}</span><span style="flex:1;background:var(--panel2);border-radius:4px;height:14px"><span style="display:block;height:14px;border-radius:4px;background:var(--accent);width:${v/mx*100}%"></span></span><span class="num" style="flex:0 0 36px">${nfFa(0).format(v)}</span></div>`).join(''); }
function orderListHTML(){ const f=S.toF||'open'; let l=tmsList('order'); if(f==='open') l=l.filter(x=>!['billed','closed','cancelled'].includes(x.status)); else if(f) l=l.filter(x=>x.status===f);

async function billOrder(o){ o=tmsGet(o.id)||o; const [ok,why]=eligibility(o); if(!ok) return toast('صدور صورت‌حساب ممکن نیست: '+why); if(o.exStatus==='pending') return toast('استثنای تجاری این سفارش هنوز تأیید نشده است.');
  const p=orderPrice(o); if(!(p.total>0)) return toast('مبلغ سفارش صفر است؛ نرخ یا پیش‌فاکتور تأییدشده لازم است.'); const a=acc(o.cust);
  const lim=o.smode==='limit'&&o.blim?o.blim:a?.limit; if(lim>0){ const b={...balOf(o.cust)}; b[p.cur]=(b[p.cur]||0)+p.total; const nb=balBase(b); if(nb>lim && !can('tms.creditEx')) return toast(`بدهی مشتری با این صورت‌حساب به ${fmt(nb,base())} ${base()} می‌رسد و از سقف اعتبار بیشتر است؛ تأیید استثنای اعتبار لازم است.`); }
  const c=catList('tcontract').find(x=>x.cust===o.cust&&x.cstatus==='active'); const terms=o.pdays||c?.terms||tSet().terms||30;
  const lines=[L(o.cust,p.cur,p.total,0), L('INC_TMS',p.cur,0,p.sub)]; if(p.tax) lines.push(L('SYS_TAX',p.cur,0,p.tax));
  try{ const v=await makeSystemVoucher('tmsbill', o.cust, lines, {order:o.id, ono:o.no, quote:o.quote||null, cur:p.cur, y:p.cur, sub:p.sub, tax:p.tax, total:p.total, amt:p.total, invno:'TMS-'+o.no, due:dayKey(Date.now()+terms*864e5)}, `صورت‌حساب حمل سفارش ${o.no} (${o.from} ← ${o.to})`);
    await tmsSave({...o, status:'billed', bill:v.id, hist:hst(o,'صدور صورت‌حساب سند '+v.no)}); logAct('add','صورت‌حساب حمل '+o.no, v.id); toast('صورت‌حساب صادر شد'); closeModal(); showReceipt(v); }catch(e){ writeErr(e); } }

RPT.einv=()=>{ const E=S.settings.einv||{}; const f=S.eiF||(S.eiF={st:''}); let l=S.vouchers.filter(v=>EINV_SALE(v)&&inR(v)&&visibleV(v)); if(f.st==='todo') l=l.filter(v=>!v.meta?.einv); if(f.st==='gen') l=l.filter(v=>v.meta?.einv?.status==='generated'); if(f.st==='sub') l=l.filter(v=>v.meta?.einv?.status==='submitted');
  const st=v=>{ const e=v.meta?.einv; return !e?'<span class="chip">صادر نشده</span>':e.status==='submitted'?`<span class="chip pos">ارسال شد ${esc(e.ref||'')}</span>`:'<span class="chip warn">فایل ساخته شد</span>'; };
  return `<div class="panel"><h2>تنظیمات فاکتور الکترونیکی امارات</h2><div class="form">${H.field('ei_trn','شمارهٔ مالیاتی فروشنده (TRN)',H.input('ei_trn',E.trn||'',{ltr:1}))}${H.field('ei_legal','نام قانونی (انگلیسی)',H.input('ei_legal',E.legal||S.settings.shopEn||'',{ltr:1}))}${H.field('ei_street','نشانی (انگلیسی)',H.input('ei_street',E.street||'',{ltr:1}))}${H.field('ei_city','شهر / امارت',H.input('ei_city',E.city||'',{ltr:1}))}${H.field('ei_pre','پیشوند شمارهٔ فاکتور',H.input('ei_pre',E.prefix||'INV-',{ltr:1}))}<div class="field"><div class="actions"><button class="btn sm primary" id="ei_save">ذخیره</button></div></div></div>
   <p class="mini">فایل‌ها با قالب استاندارد UBL 2.1 (مشخصات PINT AE) ساخته می‌شوند تا به ارائه‌دهندهٔ خدمات فاکتور الکترونیکی (ASP) خود تحویل دهید. ارسال مستقیم به سامانهٔ دولتی از این برنامه ممکن نیست؛ پس از ارسال، شمارهٔ پیگیری را ثبت کنید.</p></div>
   <div class="panel"><h2>فاکتورهای فروش و ارسال‌ها</h2>${rangeBar(H.field('ei_st','وضعیت',H.select('ei_st',[['','همه'],['todo','صادر نشده'],['gen','فایل ساخته شد'],['sub','ارسال شد']],f.st)))}
   ${!E.trn?'<div class="notice">ابتدا شمارهٔ مالیاتی (TRN) را وارد و ذخیره کنید.</div>':''}
   ${!l.length?emptyState('فاکتور فروشی در این بازه نیست',''):`<div class="tbl-wrap"><table><thead><tr><th>شماره</th><th>تاریخ</th><th>نوع</th><th>مشتری</th><th class="r">مالیات</th><th class="r">جمع</th><th>وضعیت</th><th></th></tr></thead><tbody>${l.map(v=>`<tr><td class="num click" data-v="${esc(v.id)}">${fmt(v.no,'IQD')}</td><td class="num nw">${faDate(v.ts)}</td><td>${esc(typeLabel(v))}</td><td>${esc(accName(v.party))}</td><td class="r nw">${money(v.meta.tax||v.meta.taxAmt||0,v.meta.cur||v.meta.y)}</td><td class="r nw">${money(v.meta.total||v.meta.amt,v.meta.cur||v.meta.y)}</td><td>${st(v)}</td><td class="nw">${E.trn?`<button class="btn sm" data-eix="${esc(v.id)}">فایل XML</button> <button class="btn sm" data-eis="${esc(v.id)}">ثبت ارسال</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}</div>`; };
RPT.einv_wire=()=>{ $('#ei_st').onchange=e=>{ S.eiF.st=e.target.value; renderReport(); };
  $('#ei_save').onclick=async()=>{ try{ await S.db.doc('app/settings').set({...S.settings, einv:{trn:$('#ei_trn').value.trim(), legal:$('#ei_legal').value.trim(), street:$('#ei_street').value.trim(), city:$('#ei_city').value.trim(), prefix:$('#ei_pre').value.trim()||'INV-'}}); toast('ذخیره شد'); }catch(e){ writeErr(e); } };
  $$('[data-eix]').forEach(b=>b.onclick=async()=>{ const v=S.vouchers.find(x=>x.id===b.dataset.eix); await saveFile(`einvoice-${(S.settings.einv?.prefix||'INV-')+v.no}.xml`, einvXML(v)); if(!v.meta?.einv) try{ await S.db.doc('vouchers/'+v.id).update({meta:{einv:{status:'generated',at:Date.now(),by:S.uid||null}}}); }catch(e){} });
  $$('[data-eis]').forEach(b=>b.onclick=()=>{ const v=S.vouchers.find(x=>x.id===b.dataset.eis);
    openModal(`<div class="row" style="margin-bottom:10px"><h3>ثبت ارسال فاکتور ${fmt(v.no,'IQD')}</h3><button class="btn sm" data-close>بستن</button></div><div class="form">${H.field('eis_ref','شمارهٔ پیگیری / شناسهٔ سامانه',H.input('eis_ref',v.meta?.einv?.ref||'',{ltr:1}))}<div class="field"><div class="actions"><button class="btn primary" id="eis_ok">ثبت</button></div></div></div>`);
    $('#eis_ok').onclick=async()=>{ try{ await S.db.doc('vouchers/'+v.id).update({meta:{einv:{status:'submitted',ref:$('#eis_ref').value.trim(),at:Date.now(),by:S.uid||null}}}); logAct('settings','ارسال فاکتور الکترونیکی '+v.no,v.id); toast('ثبت شد'); closeModal(); }catch(e){ writeErr(e); } }; }); };

function i18nWalk(root){ const lang=curLang(); const D=I18N[lang]; const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ const p=n.parentElement; if(!p || p.closest('script,style,textarea')) continue;
    if(n.__fa===undefined){ const t=n.nodeValue.trim(); if(!t || !(t in I18N.ar)) continue; n.__fa=n.nodeValue; }
    const t=n.__fa.trim(); const tr=lang==='fa'?null:D[t]; const nv=tr?n.__fa.replace(t,tr):n.__fa; if(n.nodeValue!==nv) n.nodeValue=nv; } }
function applyLang(){ const lang=curLang(); const r=document.documentElement; r.lang=lang;
  if(!_i18nObs){ _i18nObs=new MutationObserver(()=>{ clearTimeout(_i18nT); _i18nT=setTimeout(()=>{ _i18nObs.disconnect(); i18nWalk(document.body); _i18nObs.observe(document.body,{childList:true,subtree:true}); },30); }); }
  _i18nObs.disconnect(); i18nWalk(document.body); if(lang!=='fa' || document.body.querySelector) _i18nObs.observe(document.body,{childList:true,subtree:true}); }

function fxDayPos(dayStr){ /* replays WAC positions; returns {prev:{c:{q,c}}, buy:{c:{q,v}}, sell:{c:{q,v}}, close:{c:{q,c}}} for given day */
  const B=base(), inv={}, I=c=>inv[c]||(inv[c]={q:0,c:0}); const out={prev:null,buy:{},sell:{},close:null,pl:{}}; let today=false; const addPl=(c,p)=>{ if(today) out.pl[c]=(out.pl[c]||0)+p; };
  const acq=(c,q,cost)=>{ const x=I(c); if(x.q<-EPS){ const cov=Math.min(q,-x.q), part=cost*cov/q, avg=x.c/x.q; addPl(c,cov*avg-part); x.q+=cov; x.c+=cov*avg; q-=cov; cost-=part; if(Math.abs(x.q)<EPS){x.q=0;x.c=0} } if(q>EPS){ x.q+=q; x.c+=cost } };
  const dis=(c,q,proc)=>{ const x=I(c); if(x.q>EPS){ const d=Math.min(q,x.q), part=proc*d/q, avg=x.c/x.q; addPl(c,part-d*avg); x.q-=d; x.c-=d*avg; q-=d; proc-=part; if(Math.abs(x.q)<EPS){x.q=0;x.c=0} } if(q>EPS){ x.q-=q; x.c-=proc } };
  const snap=()=>JSON.parse(JSON.stringify(inv));
  const list=posted().slice().sort((a,b)=>a.ts-b.ts||a.createdAt-b.createdAt);
  for(const v of list){ const dk=dayKey(v.ts); if(dk>dayStr) break; if(dk===dayStr&&!out.prev) out.prev=snap(); today=dk===dayStr;
    const VB=v.base||B, rb=v.rb||{}; const pb=c=>c===VB?1:(rb[c]||perBase(c)/perBase(VB));
    if(v.type==='opening'){ for(const l of v.lines){ if(l.a==='SYS_EQUITY'||l.c===VB) continue; const q=(l.dr||0)-(l.cr||0); const cost=Math.abs(q)/pb(l.c); q>0?acq(l.c,q,cost):dis(l.c,-q,cost); } }
    if(v.type==='reval'&&v.meta?.bpu){ for(const [c,bpu] of Object.entries(v.meta.bpu)){ const x=I(c); if(Math.abs(x.q)>EPS){ addPl(c,x.q*bpu-x.c); x.c=x.q*bpu; } } }
    if(v.deal){ const d=v.deal; const Vv=d.ic===VB?d.ia:d.oc===VB?d.oa:d.ia/pb(d.ic);
      if(d.ic!==VB){ acq(d.ic,d.ia,Vv); if(dk===dayStr){ const o=out.buy[d.ic]||(out.buy[d.ic]={q:0,v:0,n:0}); o.q+=d.ia; o.v+=Vv; o.n++; } }
      if(d.oc!==VB){ dis(d.oc,d.oa,Vv); if(dk===dayStr){ const o=out.sell[d.oc]||(out.sell[d.oc]={q:0,v:0,n:0}); o.q+=d.oa; o.v+=Vv; o.n++; } } } }
  if(!out.prev) out.prev=snap(); out.close=snap(); return out; }

function normSettings(d){
  const s={...clone(DEFAULTS), ...d};
  s.currencies = Array.isArray(d.currencies)&&d.currencies.length ? d.currencies.map(c=>({...c, code:c.code,name:c.name||c.code,q:c.q||(c.perBase>=1?'bc':'cb'),buy:+c.buy||(c.perBase?(c.perBase>=1?c.perBase:1/c.perBase):1),sell:+c.sell||(c.perBase?(c.perBase>=1?c.perBase:1/c.perBase):1)})) : clone(DEFAULTS.currencies);
  s.currencies.forEach((c,i)=>{ const o=(d.currencies||[])[i]; if(o?.kind) c.kind=o.kind; });
  EXTRA_CUR.forEach(code=>{ if(!s.currencies.some(c=>c.code===code)) s.currencies.push(clone(DEFAULTS.currencies.find(c=>c.code===code))); });
  if(!s.currencies.some(c=>c.code===s.base)) s.currencies.unshift({code:s.base,name:s.base,q:'cb',buy:1,sell:1});
  s.gold={...DEFAULTS.gold,...(d.gold||{})}; s.oil={...DEFAULTS.oil,...(d.oil||{})}; s.groups={...DEFAULTS.groups,...(d.groups||{})}; s.payroll={...DEFAULTS.payroll,...(d.payroll||{})};
  s.stages=Array.isArray(d.stages)&&d.stages.length?d.stages:clone(DEFAULTS.stages); s.fy=Array.isArray(d.fy)?d.fy:[];
  return s;
}

  const rows=vs.map(v=>{ const m=v.meta; const q=v.type==='oil'?(m.side==='buy'?m.tons:-m.tons):0; tons+=q; pr+=profitOf(v); if(v.type==='oil') amt[m.y]=(amt[m.y]||0)+(m.side==='sell'?m.total:-m.total); return {v,q,run:tons}; });
  return `<div class="panel"><h2>صورت‌حساب سرویس — ${esc(sv.name)}</h2>${rangeBar(H.field('sv_s','سرویس',H.select('sv_s',svcs.map(x=>[x.id,x.name]),sv.id)))}
   <div class="kpis">${[['شناور',esc(accName(sv.ocar)||'—')],['خالص سوخت (تن)',fmt(tons,O)],['خالص مبلغ (فروش − خرید)',Object.entries(amt).map(([c,x])=>money(x,c)).join(' · ')||'—'],['سود و زیان',money(pr,B)]].map(([l,v])=>`<div class="kpi"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join('')}</div>
   ${!rows.length?emptyState('در این بازه سندی برای این سرویس نیست',''):`<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>تاریخ</th><th>شماره</th><th>نوع</th><th>طرف حساب</th><th>حامل</th><th class="r">مقدار (تن)</th><th class="r">نرخ</th><th class="r">مبلغ</th><th class="r">ماندهٔ تن</th><th class="r">سود (${esc(B)})</th></tr></thead><tbody>${rows.map(({v,q,run})=>{ const m=v.meta; return `<tr class="click" data-v="${esc(v.id)}"><td class="num nw">${faDate(v.ts)}</td><td class="num">${fmt(v.no,'IQD')}</td><td>${esc(typeLabel(v))}</td><td>${esc(accName(v.party)||'—')}</td><td>${esc(accName(m.ocar)||'—')}</td><td class="r num ${q<0?'neg':''}">${q?fmt(q,O):'—'}</td><td class="r num">${m.price?fmtRate(m.price):'—'}</td><td class="r num nw">${m.total?money(m.total,m.y):'—'}</td><td class="r num">${fmt(run,O)}</td><td class="r num ${profitOf(v)>=0?'pos':'neg'}">${fmt(profitOf(v),B)}</td></tr>`; }).join('')}</tbody></table></div>`}</div>`; };
RPT.svcstmt_wire=()=>{ if($('#sv_s')) $('#sv_s').onchange=e=>{ S.svF.svc=e.target.value; renderReport(); }; };
function userDoc(){ const q=S.qbar||S.users?.find(u=>u.uid===S.uid)?.qbar; return {uid:S.uid, lastSeen:Date.now(), branch:S.branch||'', agent:(navigator.userAgent||'').slice(0,120), ...(q?{qbar:q}:{})}; }
boot();
</script>
